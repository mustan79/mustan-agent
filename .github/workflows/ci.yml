name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,ide]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and verify CLI outside source checkout
        shell: bash
        run: |
          python -m pip uninstall -y mustan-agent
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          mustan-agent --version
          mustan-agent --help
          mustan-agent scan .
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -c "import tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == '$VERSION'"
          git archive --format=zip --prefix="mustan-agent-$VERSION/" -o "dist/mustan-agent-$VERSION-source.zip" HEAD
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --title "MustanAgent $VERSION" --notes-file doc/RELEASE_NOTES.md --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
